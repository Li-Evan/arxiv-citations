<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Citation Counts for arXiv</title>
  <link rel="stylesheet" href="page.css">
</head>
<body>
  <div class="brand">
    <img src="icons/icon128.png" alt="">
    <h1 data-i18n="optTitle"></h1>
  </div>

  <h2 data-i18n="optConsentHeading"></h2>
  <p id="consentState" class="muted"></p>
  <div class="row">
    <a id="enable" href="welcome.html" target="_blank" data-i18n="optConsentEnable" hidden></a>
    <button id="withdraw" type="button" data-i18n="optWithdraw" hidden></button>
  </div>

  <h2 data-i18n="optKeyHeading"></h2>
  <p class="lead" data-i18n="optLead"></p>
  <p><strong data-i18n="optHowHeading"></strong></p>
  <ol>
    <li data-i18n-html="optStep1"></li>
    <li data-i18n="optStep2"></li>
    <li data-i18n-html="optStep3"></li>
  </ol>

  <form id="form">
    <label for="key" data-i18n="optKeyLabel"></label>
    <input id="key" type="password" autocomplete="off" spellcheck="false" data-i18n-placeholder="optKeyPlaceholder">
    <div class="row">
      <button id="save" class="primary" type="submit" data-i18n="optSave"></button>
      <button id="clear" type="button" data-i18n="optClear" hidden></button>
    </div>
  </form>
  <p id="saved" class="muted"></p>
  <div id="status" class="status" role="status"></div>

  <p class="note"><span data-i18n="optNote"></span><br><span data-i18n-html="optFooter"></span></p>

  <script src="i18n.js"></script>
  <script src="options.js"></script>
</body>
</html>
