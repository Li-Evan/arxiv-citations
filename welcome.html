<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Citation Counts for arXiv</title>
  <link rel="stylesheet" href="page.css">
</head>
<body>
  <div class="brand">
    <img src="icons/icon128.png" alt="">
    <h1 data-i18n="welcomeTitle"></h1>
  </div>
  <p class="lead" data-i18n="welcomeIntro"></p>

  <h2 data-i18n="welcomeDataHeading"></h2>
  <ul>
    <li data-i18n="welcomeData1"></li>
    <li data-i18n="welcomeData2"></li>
    <li data-i18n="welcomeData3"></li>
    <li data-i18n="welcomeData4"></li>
    <li data-i18n="welcomeData5"></li>
  </ul>
  <p data-i18n-html="welcomePrivacy"></p>

  <div class="row">
    <button id="agree" class="primary" type="button" data-i18n="welcomeAgree"></button>
    <button id="decline" type="button" data-i18n="welcomeDecline"></button>
  </div>
  <div id="status" class="status" role="status"></div>

  <p class="note" data-i18n="notAffiliated"></p>

  <script src="i18n.js"></script>
  <script src="welcome.js"></script>
